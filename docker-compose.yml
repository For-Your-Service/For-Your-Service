version: '3.8'

services:
  # ============================================================================
  # 1. Streamlit Veteran Intake & Analytics Portal (Port 8501)
  # ============================================================================
  portal:
    build:
      context: .
      dockerfile: docker/Dockerfile.portal
    container_name: fys-portal
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8080
      - ENV=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fys-network

  # ============================================================================
  # 2. FastAPI Ingestion & Neural Scoring Microservice (Port 8080)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: fys-api
    ports:
      - "8080:8080"
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - fys-network

  # ============================================================================
  # 3. Scheduled Multi-Source Feed Harvester (USAJOBS / Adzuna / BLS)
  # ============================================================================
  ingestor:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestor
    container_name: fys-ingestor
    environment:
      - ENV=production
      - API_URL=http://api:8080
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fys-network

  # ============================================================================
  # 4. Apache Spark Batch Lakehouse Runner (On-Demand / Batch Profile)
  # ============================================================================
  spark-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: fys-spark-runner
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
    volumes:
      - ./data:/app/data
    profiles:
      - batch
    networks:
      - fys-network

networks:
  fys-network:
    driver: bridge
