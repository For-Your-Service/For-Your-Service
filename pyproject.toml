[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "for-your-service"
version = "0.1.0"
description = "AI-powered veteran job matching platform"
authors = [
    {name = "Free Hall", email = "whall4.wh@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/For-Your-Service/For-Your-Service"
Repository = "https://github.com/For-Your-Service/For-Your-Service.git"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
