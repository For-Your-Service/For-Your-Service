name: System & Application Health Monitor

on:
  schedule:
    # Run twice daily at 09:00 and 21:00 UTC
    - cron: '0 9,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: write

jobs:
  health-check:
    name: Run Twice-Daily Health Check & Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install -r app/requirements.txt
          pip install pytest anyio

      - name: Execute Full Test Suite & Diagnostics
        run: |
          pytest -v

      - name: Generate Health Report
        run: |
          python scripts/system_health_monitor.py

      - name: Commit and Push Updated Health Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/SYSTEM_HEALTH.md
          if git diff --staged --quiet; then
            echo "No changes in health report."
          else
            git commit -m "docs(health): automated twice-daily system health update [skip ci]"
            git push origin main
          fi
