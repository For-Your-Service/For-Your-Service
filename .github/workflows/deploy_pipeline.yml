name: Execute Job Offering Pipeline

on:
  workflow_dispatch:
    inputs:
      job_target:
        description: 'Target job offering source'
        required: true
        default: 'all'
  push:
    branches:
      - main

jobs:
  run-databricks-job:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.2.0

      - name: Trigger Databricks Pipeline
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # PowerShell execution on runner
          $Params = @{
              api_key = "${{ secrets.JOB_OFFERING_API_KEY }}"
              target_source = "${{ github.event.inputs.job_target }}"
          } | ConvertTo-Json -Compress

          databricks jobs run-now <YOUR_DATABRICKS_JOB_ID> --notebook-params $Params
