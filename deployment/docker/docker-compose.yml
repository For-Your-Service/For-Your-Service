version: '3.8'
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/models/siamese_v1.pth
      - DATABASE_URL=postgresql://user:pass@db:5432/fys
    depends_on:
      - db
  
  db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fys
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
